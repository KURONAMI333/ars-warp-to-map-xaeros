# Ars Nouveau 本体 (compileOnly)。Modrinth 公式配布の version_number。
arsnouveau_version=4.12.7
# Xaero's Minimap: Reflection 直叩きのため compileOnly / 依存宣言は不要。
# runtime のみ（dev 実機確認用・published jar には漏れない）。
# 版は T2M(mod-076) が reflection チェーンを一次確認した 26.4.2 に固定する。
xaeros_minimap_version_id=forge-1.20.1-26.4.2

# Ars Nouveau の必須依存（dev 起動用 runtime。配布 jar のメタデータは変えない）。
# version_number は別ローダーで重複し得るため、ローダーを一意に定める version ID で固定する。
# curios 5.14.1+1.20.1 / geckolib 4.8.4（どちらも Ars の必須レンジを満たす）
curios_version_id=IPQlZkz1
geckolib_version_id=aC5KMoNg
