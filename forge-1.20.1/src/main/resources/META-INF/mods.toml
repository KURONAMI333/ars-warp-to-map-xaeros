modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://x.com/kuronami333"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"
logoFile="logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/ars-warp-to-map-xaeros"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Ars Nouveau: 巻物データの供給源。任意（不在では静かに何もしない＝Inner class isolation）。
# versionRange は Ars の版が複合文字列（例 4.12.7-1.20.1）のため下限を緩く取る。
[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# Xaero's Minimap: 依存宣言しない（T2M/mod-076 に合わせる）。
# Reflection 直叩きのため jar を参照せず、不在時は静かに何もしない
# （巻物の読み取りも反映もクライアント側で完結し、Xaero 不在時は何も表示されないだけ）。
