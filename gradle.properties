# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=arswarptomapx
mod_name=Ars Warp to Map: Xaero's
mod_license=All Rights Reserved
mod_version=1.0.1
mod_group_id=com.kuronami.arswarptomapx
mod_authors=KURONAMI
mod_description=Shows the destinations of your Ars Nouveau warp scrolls as Xaero's Minimap waypoints.

# ─── Dependencies ─────────────────────────────────────────────
# Ars Nouveau (compileOnly・Modrinth maven。Modrinth project ars-nouveau / CF 401955)
arsnouveau_version=5.13.3
# Xaero's Minimap: Reflection 直叩きのため compileOnly / 依存宣言は不要。
# localRuntime のみ（dev 実機確認用・published jar には漏れない）。
# 版は T2M(mod-076) が reflection チェーンを一次確認した 26.4.2 に固定する。
xaeros_version=neoforge-1.21.1-26.4.2

# Ars Nouveau の必須依存（dev 起動用 localRuntime。配布 jar のメタデータは変えない）。
# version_number は別ローダーで重複し得るため、ローダーを一意に定める version ID で固定する。
# curios 9.5.1+1.21.1 / geckolib 4.9.3（geckolib は Ars の [4.2.1,) を満たす）
curios_version_id=yohfFbgD
geckolib_version_id=Grwn5rUB
